[project]
name = "triton-flash-attention-2"
version = "0.1.0"
description = "Triton flash attention implementation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5.0",
    "einops",
    "numpy",
    "pandas>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triton_flash_attention_2"]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

# Notebook + test tooling (installed automatically via `uv sync`)
[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "matplotlib",
    "seaborn",
    "pytest>=8",
]
